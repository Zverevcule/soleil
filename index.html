,0) 70%)}\n@keyframes shadeDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}\n@keyframes sway{0%{transform:skewX(-1.1deg)}100%{transform:skewX(1.1deg)}}\n.js-on .hero-sky{display:block;-webkit-mask-image:linear-gradient(to bottom,transparent 5%,#000 15%,#000 55%,transparent 66%);mask-image:linear-gradient(to bottom,transparent 5%,#000 15%,#000 55%,transparent 66%);will-change:transform}\n.js-on .hero-shade{opacity:1}\n.js-on .shade-track{animation:shadeDrift 110s linear infinite}\n@media (hover: hover) and (min-width: 900px){.js-on .hero-wheat{display:block;transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to bottom,transparent 77%,#000 89%);mask-image:linear-gradient(to bottom,transparent 77%,#000 89%);animation:sway 6.5s ease-in-out infinite alternate}}\n.js-on .hero .hero-bg img{filter:brightness(.62) saturate(.82) contrast(.96)}\n.js-on.is-loaded .hero .hero-bg img{filter:brightness(1) saturate(1) contrast(1);transition:filter 4.4s cubic-bezier(.45,0,.25,1) .3s}\n.js-on .hero .hx{opacity:0;transform:translateY(18px);transition:opacity 1.8s cubic-bezier(.4,0,.2,1),transform 2s cubic-bezier(.2,.7,.2,1)}\n.js-on.is-loaded .hero .hx{opacity:1;transform:none}\n@media (max-width: 760px){.hero-copy{justify-content:flex-end !important;padding-bottom:110px !important}.hero-veil{background:linear-gradient(to top,rgba(242,230,212,.8) 0%,rgba(242,230,212,.35) 42%,rgba(242,230,212,0) 66%) !important}}\n.js-on .swapA .item{animation:itemA .8s cubic-bezier(.2,.7,.2,1) both}\n.js-on .swapB .item{animation:itemB .8s cubic-bezier(.2,.7,.2,1) both}\n.js-on .menu-grid .item:nth-child(2){animation-delay:.08s}.js-on .menu-grid .item:nth-child(3){animation-delay:.16s}.js-on .menu-grid .item:nth-child(4){animation-delay:.24s}\n.hl .hw{opacity:clamp(.16, calc(var(--p, 1) * 22 - var(--i)), 1);transition:opacity .25s}\n.mag{transition:transform .4s cubic-bezier(.2,.7,.2,1)}\n@media (prefers-reduced-motion: reduce){.soleil *{animation:none !important;t ter; padding: 10px 20px\">Baked by hand every morning <span style=\"color: #B58B52; padding: 0 12px\">✦<\u002Fspan> Order ahead for counter pickup<\u002Fdiv>\n\n<!-- 01 HEADER -->\n<header style=\"{{headerStyle}}\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: 12px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px\">\n<a href=\"#top\" aria-label=\"SOLEIL home\" style=\"display: block; width: 182px; height: 70px; overflow: hidden\">\n<img class=\"logo\" src=\"1607d796-cbe1-4c08-b805-3b47ae89e05e\" alt=\"SOLEIL — Classic Artisan Bakery\" style=\"display: block; width: 220px; height: 70px; object-fit: cover; margin-left: -39px\">\n<\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 8px 40px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase\">\n<a class=\"navlink is-on\" href=\"#top\" aria-current=\"page\">Home<\u002Fa>\n<a class=\"navlink\" href=\"#menu\">Menu<\u002Fa>\n<a class=\"navlink\" href=\"#story\">Our Story<\u002Fa>\n<a class=\"navlink\" href=\"#visit\">Contact<\u002Fa>\n<\u002Fnav>\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<button class=\"iconbtn\" data-magnetic=\"\" type=\"button\" aria-label=\"Search\" style=\"width: 44px; height: 44px; border: 1px solid rgba(41,40,32,.25); background: transparent; color: #292820; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><circle cx=\"10.5\" cy=\"10.5\" r=\"6.5\"><\u002Fcircle><path d=\"M15.5 15.5 21 21\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<button class=\"iconbtn\" data-magnetic=\"\" type=\"button\" aria-label=\"Basket, {{cart}} items\" style=\"position: relative; width: 44px; height: 44px; border: 1px solid rgba(41,40,32,.25); background: transparent; color: #292820; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%\">\n<svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"><path d=\"M4 9h16l-1.6 10.2a1.5 1.5 0 0 1-1.5 1.3H7.1a1.5 1.5 0 0 1-1.5-1.3L4 9Z\"><\u002Fpath><path d=\"M8.5 9 12 3.5 15.5 9\"><\u002Fpath><\u002Fsvg>\n<span style=\"position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #702A35; color: #F2E6D4; font-size: 11px; line-height: 20px; text-align: center\">{{cart}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- 02 HERO — cinematic golden morning -->\n<section id=\"home\" class=\"hero\" aria-labelledby=\"hero-title\" style=\"position: relative; height: clamp(560px, 92vh, 1080px); overflow: hidden; background: #E9B784\">\n<div class=\"hero-bg\" style=\"position: absolute; left: 0; right: 0; top: -5%; bottom: -5%; will-change: transform\">\n<img class=\"hero-photo\" src=\"b58d94fd-7020-4f64-8814-ed778d980e5d\" alt=\"Golden sunrise over rolling countryside, a stone farmhouse and wheat fields\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%\">\n<img class=\"hero-sky\" src=\"b58d94fd-7020-4f64-8814-ed778d980e5d\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%\">\n<img class=\"hero-wheat\" src=\"b58d94fd-7020-4f64-8814-ed778d980e5d\" alt=\"\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 50%\">\n<div class=\"hero-shade\" aria-hidden=\"true\"><div class=\"shade-track\"><\u002Fdiv><\u002Fdiv>\n<canvas class=\"hero-light\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\"><\u002Fcanvas>\n<\u002Fdiv>\n<div class=\"hero-veil\" aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: linear-gradient(90deg, rgba(242,230,212,.42) 0%, rgba(242,230,212,.2) 34%, rgba(242,230,212,0) 58%)\"><\u002Fdiv>\n<div class=\"hero-copy\" style=\"position: relative; z-index: 2; height: 100%; max-width: 1360px; margin: 0 auto; padding: 0 40px 40px; display: flex; flex-direction: column; justify-content: center\">\n<div style=\"max-width: 640px; display: flex; flex-direction: column; gap: 28px\">\n<div class=\"hx\" style=\"display: flex; align-items: center; gap: 16px; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #3B2A20; transition-delay: 1.5s\">\n<span>Nº 01<\u002Fspan><span style=\"width: 56px; height: 1px; background: #3B2A20\"><\u002Fspan><span>Classic Artisan Bakery<\u002Fspan>\n<\u002Fdiv>\n<h1 id=\"hero-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(58px, 8vw, 132px); line-height: .94; letter-spacing: -.02em; color: #292820\">\n<span class=\"hx\" style=\"display: block; transition-delay: 1.9s\">Golden<\u002Fspan>\n<span class=\"hx\" style=\"display: block; transition-delay: 2.2s\">Mornings<\u002Fspan>\n<span class=\"hx\" style=\"display: block; transition-delay: 2.5s\">Start <em style=\"font-weight: 400; color: #702A35\">Here.<\u002Fem><\u002Fspan>\n<\u002Fh1>\n<p class=\"hx\" style=\"margin: 0; max-width: 400px; font-size: 18px; font-weight: 400; line-height: 1.55; color: #33291F; transition-delay: 3.1s\">Freshly baked moments, made to brighten your day.<\u002Fp>\n<div class=\"hx\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 28px; transition-delay: 3.5s\">\n<a class=\"btn btn-olive mag\" data-magnetic=\"\" href=\"#menu\" style=\"display: inline-block; background: #405438; color: #F2E6D4; text-decoration: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 18px 30px\">Explore Our Bakery<\u002Fa>\n<a class=\"ulink\" href=\"#story\" style=\"color: #292820; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 6px 0\">Our Story<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hx\" aria-hidden=\"true\" style=\"position: absolute; z-index: 2; left: 50%; bottom: 26px; margin-left: -50px; width: 100px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: #F7EEDF; transition-delay: 4.3s\">\n<span>Scroll<\u002Fspan>\n<span style=\"position: relative; display: block; width: 1px; height: 44px; background: rgba(247,238,223,.3); overflow: hidden\"><span class=\"cue\" style=\"position: absolute; inset: 0; background: #F7EEDF\"><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- MARQUEE (scroll-velocity driven) -->\n<div aria-hidden=\"true\" style=\"background: #405438; color: #F2E6D4; border-top: 1px solid #292820; border-bottom: 1px solid #292820; overflow: hidden; padding: 22px 0\">\n<div class=\"mq\" data-dir=\"1\" style=\"display: flex; width: max-content; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 40px; line-height: 1; white-space: nowrap; will-change: transform\">\n<span style=\"padding-right: 28px\">Croissant au Beurre <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Pain au Chocolat <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Baguette de Tradition <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Brioche <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Café Crème <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Pain de Campagne <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan><\u002Fspan>\n<span style=\"padding-right: 28px\">Croissant au Beurre <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Pain au Chocolat <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Baguette de Tradition <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Brioche <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Café Crème <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan> Pain de Campagne <span style=\"color: #B58B52; font-style: normal; padding: 0 28px\">✦<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 03 THE MORNING RITUAL — pinned horizontal journey -->\n<section id=\"ritual\" class=\"ritual-pin\" aria-labelledby=\"ritual-title\" style=\"position: relative; height: 3000px\">\n<div class=\"ritual-sticky\" style=\"position: sticky; top: 0; height: min(100vh, 900px); overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 40px; padding: 48px 0\">\n<div data-reveal=\"\" style=\"max-width: 1360px; width: 100%; margin: 0 auto; padding: 0 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n<div>\n<div class=\"rv\" style=\"font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #654331; margin-bottom: 14px\">Nº 02 — The Craft<\u002Fdiv>\n<h2 id=\"ritual-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(42px, 5.2vw, 84px); line-height: 1; color: #292820\"><span class=\"wm\"><span class=\"wi\">The<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .08s\">Morning<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .16s\"><em style=\"font-weight: 400; color: #405438\">Ritual<\u002Fem><\u002Fspan><\u002Fspan><\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 18px; min-width: 260px\">\n<span class=\"ritual-count\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; color: #702A35; min-width: 46px\"><\u002Fspan>\n<span style=\"flex: 1; height: 1px; background: rgba(41,40,32,.2)\"><span class=\"ritual-bar\" style=\"display: block; height: 1px; background: #702A35; transform-origin: left; transform: scaleX(0)\"><\u002Fspan><\u002Fspan>\n<span style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; color: #654331\">V<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ritual-track\" style=\"display: flex; gap: 48px; padding: 0 40px; width: max-content; will-change: transform\">\n<article style=\"width: min(1040px, 84vw); flex: none; display: flex; flex-wrap: wrap; gap: 40px; border-top: 1px solid #292820; padding-top: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(80px, 10vw, 150px); line-height: .8; color: #B58B52\">I<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05\">The Levain<\u002Fh3>\n<div style=\"font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #702A35\">Le levain<\u002Fdiv>\n<p style=\"margin: 0; max-width: 420px; font-weight: 300; font-size: 17px; color: #3E3A30\">Our starter is fed flour and water every day. Its slow, wild fermentation gives the bread its depth, its keeping quality and its gentle tang.<\u002Fp>\n<\u002Fdiv>\n<div class=\"zoom\" data-cursor=\"Look\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid rgba(101,67,49,.5); padding: 8px\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: the levain jar, bubbling\" style=\"height: clamp(180px, 34vh, 380px); display: flex; align-items: flex-end; justify-content: center; padding: 22px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph — the levain jar<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article style=\"width: min(1040px, 84vw); flex: none; display: flex; flex-wrap: wrap; gap: 40px; border-top: 1px solid #292820; padding-top: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(80px, 10vw, 150px); line-height: .8; color: #B58B52\">II<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05\">Lamination<\u002Fh3>\n<div style=\"font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #702A35\">Le feuilletage<\u002Fdiv>\n<p style=\"margin: 0; max-width: 420px; font-weight: 300; font-size: 17px; color: #3E3A30\">Cold butter is folded into the dough again and again, building the fine layers that make a croissant shatter at the first bite.<\u002Fp>\n<\u002Fdiv>\n<div class=\"zoom\" data-cursor=\"Look\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid rgba(101,67,49,.5); padding: 8px\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: butter sealed into dough\" style=\"height: clamp(180px, 34vh, 380px); display: flex; align-items: flex-end; justify-content: center; padding: 22px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph — butter sealed into dough<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article style=\"width: min(1040px, 84vw); flex: none; display: flex; flex-wrap: wrap; gap: 40px; border-top: 1px solid #292820; padding-top: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(80px, 10vw, 150px); line-height: .8; color: #B58B52\">III<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05\">Shaping<\u002Fh3>\n<div style=\"font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #702A35\">Le façonnage<\u002Fdiv>\n<p style=\"margin: 0; max-width: 420px; font-weight: 300; font-size: 17px; color: #3E3A30\">Every croissant is cut and rolled by hand; every loaf is pre-shaped, rested, then shaped again with a light, practised touch.<\u002Fp>\n<\u002Fdiv>\n<div class=\"zoom\" data-cursor=\"Look\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid rgba(101,67,49,.5); padding: 8px\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: rolling croissants by hand\" style=\"height: clamp(180px, 34vh, 380px); display: flex; align-items: flex-end; justify-content: center; padding: 22px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph — rolling by hand<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article style=\"width: min(1040px, 84vw); flex: none; display: flex; flex-wrap: wrap; gap: 40px; border-top: 1px solid #292820; padding-top: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(80px, 10vw, 150px); line-height: .8; color: #B58B52\">IV<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05\">The Bake<\u002Fh3>\n<div style=\"font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #702A35\">La cuisson<\u002Fdiv>\n<p style=\"margin: 0; max-width: 420px; font-weight: 300; font-size: 17px; color: #3E3A30\">Into a hot oven with a burst of steam. The crust blisters, the colour deepens to gold, and the bakery fills with the smell of morning.<\u002Fp>\n<\u002Fdiv>\n<div class=\"zoom\" data-cursor=\"Look\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid rgba(101,67,49,.5); padding: 8px\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: loaves sliding into the oven\" style=\"height: clamp(180px, 34vh, 380px); display: flex; align-items: flex-end; justify-content: center; padding: 22px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph — into the oven<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<article style=\"width: min(1040px, 84vw); flex: none; display: flex; flex-wrap: wrap; gap: 40px; border-top: 1px solid #292820; padding-top: 28px\">\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(80px, 10vw, 150px); line-height: .8; color: #B58B52\">V<\u002Fdiv>\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 42px; line-height: 1.05\">The Counter<\u002Fh3>\n<div style=\"font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #702A35\">Le comptoir<\u002Fdiv>\n<p style=\"margin: 0; max-width: 420px; font-weight: 300; font-size: 17px; color: #3E3A30\">Bakes cool on linen, the coffee is poured, the doors open. Golden mornings start here.<\u002Fp>\n<\u002Fdiv>\n<div class=\"zoom\" data-cursor=\"Look\" style=\"flex: 1 1 320px; min-width: 0; border: 1px solid rgba(101,67,49,.5); padding: 8px\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: the full counter at opening\" style=\"height: clamp(180px, 34vh, 380px); display: flex; align-items: flex-end; justify-content: center; padding: 22px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph — the counter at opening<\u002Fdiv><\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 MENU -->\n<section id=\"menu\" aria-labelledby=\"menu-title\" style=\"background: #EFE1CB; border-top: 1px solid rgba(41,40,32,.18); border-bottom: 1px solid rgba(41,40,32,.18)\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: 120px 40px\">\n<div data-reveal=\"\" style=\"text-align: center; margin-bottom: 48px\">\n<div class=\"rv\" style=\"font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #654331; margin-bottom: 16px\">Nº 03 — From the Counter<\u002Fdiv>\n<h2 id=\"menu-title\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(44px, 5.4vw, 84px); line-height: 1; color: #292820\"><span class=\"wm\"><span class=\"wi\">Today’s<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .1s\"><em style=\"font-weight: 400; color: #702A35\">Bakes<\u002Fem><\u002Fspan><\u002Fspan><\u002Fh2>\n<div class=\"rule\" style=\"width: 120px; height: 1px; background: #702A35; margin: 28px auto 0\"><\u002Fdiv>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Menu categories\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 48px; margin-bottom: 56px\">\n<sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"3\">\n<button class=\"tab\" type=\"button\" role=\"tab\" aria-selected=\"{{t.selected}}\" sc-camel-on-click=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"menu-grid {{swapClass}}\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border-top: 1px solid rgba(41,40,32,.25); border-left: 1px solid rgba(41,40,32,.25)\">\n<sc-for list=\"{{items}}\" as=\"it\" hint-placeholder-count=\"4\">\n<article class=\"item zoom\" style=\"border-right: 1px solid rgba(41,40,32,.25); border-bottom: 1px solid rgba(41,40,32,.25); padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div data-cursor=\"Taste\" style=\"overflow: hidden\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: {{it.name}}\" style=\"aspect-ratio: 4 / 5; display: flex; align-items: flex-end; justify-content: center; padding: 18px; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Photograph<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px\">\n<h3 style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 28px; line-height: 1.05; color: #292820\">{{it.name}}<\u002Fh3>\n<span style=\"font-size: 13px; color: #654331; white-space: nowrap\">[PRICE]<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; font-weight: 300; color: #3E3A30; flex: 1\">{{it.desc}}<\u002Fp>\n<button class=\"btn btn-line\" type=\"button\" sc-camel-on-click=\"{{add}}\" style=\"align-self: flex-start; min-height: 44px; background: transparent; border: 1px solid #702A35; color: #702A35; font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; padding: 12px 20px; cursor: pointer\">Add to basket<\u002Fbutton>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"text-align: center; margin-top: 56px\"><a class=\"btn btn-olive mag\" data-magnetic=\"\" href=\"#menu\" style=\"display: inline-block; background: #405438; color: #F2E6D4; text-decoration: none; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 18px 34px\">View the Full Menu<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 ANATOMY / EDUCATIONAL -->\n<section id=\"layers\" aria-labelledby=\"layers-title\" style=\"max-width: 1360px; margin: 0 auto; padding: 120px 40px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 64px; align-items: center\">\n<div data-reveal=\"\" style=\"flex: 1 1 380px; min-width: 0\">\n<div class=\"rv\" style=\"font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #654331; margin-bottom: 16px\">Nº 04 — A Small Lesson<\u002Fdiv>\n<h2 id=\"layers-title\" style=\"margin: 0 0 24px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: clamp(44px, 5vw, 76px); line-height: 1; color: #292820\"><span class=\"wm\"><span class=\"wi\">The<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .07s\">Anatomy<\u002Fspan><\u002Fspan><br><span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .14s\">of<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .21s\">a<\u002Fspan><\u002Fspan> <span class=\"wm\"><span class=\"wi\" style=\"transition-delay: .28s\"><em style=\"font-weight: 400; color: #702A35\">Croissant<\u002Fem><\u002Fspan><\u002Fspan><\u002Fh2>\n<p class=\"rv\" style=\"margin: 0 0 32px; max-width: 460px; font-weight: 300; font-size: 17px; color: #3E3A30; transition-delay: .2s\">A cold block of butter is sealed inside the dough, then rolled and folded in three — a “letter fold”. Each fold triples the layers of butter. In the oven, water in the butter turns to steam and lifts every layer apart. Fold the dough yourself:<\u002Fp>\n<div class=\"rv\" role=\"group\" aria-label=\"Number of folds\" style=\"display: flex; border: 1px solid #292820; border-right: 0; width: max-content; max-width: 100%; transition-delay: .3s\">\n<sc-for list=\"{{folds}}\" as=\"f\" hint-placeholder-count=\"4\">\n<button type=\"button\" aria-pressed=\"{{f.selected}}\" sc-camel-on-click=\"{{f.pick}}\" style=\"{{f.style}}\">{{f.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"rv\" style=\"display: flex; gap: 48px; margin-top: 40px; transition-delay: .4s\">\n<div><div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 72px; line-height: 1; color: #405438\">{{butter}}<\u002Fdiv><div style=\"font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Layers of butter<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 72px; line-height: 1; color: #702A35\">{{dough}}<\u002Fdiv><div style=\"font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\">Layers of dough<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figure class=\"clip\" data-reveal=\"\" style=\"flex: 1 1 440px; min-width: 0; margin: 0\">\n<div role=\"img\" aria-label=\"Cross-section of laminated dough showing {{butter}} butter layers\" style=\"border: 1px solid #654331; padding: 14px; background: #F7EEDF\">\n<div style=\"height: 380px; display: flex; flex-direction: column; overflow: hidden; border-radius: 160px 160px 6px 6px\">\n<sc-for list=\"{{stripes}}\" as=\"st\" hint-placeholder-count=\"7\">\n<div class=\"stripe\" style=\"{{st.style}}\"><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption style=\"display: flex; justify-content: space-between; margin-top: 14px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #654331\"><span>Fig. 2 — Cross-section<\u002Fspan><span><span style=\"display: inline-block; width: 10px; height: 10px; background: #F4DD9C; border: 1px solid #654331; vertical-align: middle; margin-right: 6px\"><\u002Fspan>Butter <span style=\"display: inline-block; width: 10px; height: 10px; background: #C99A5B; vertical-align: middle; margin: 0 6px 0 16px\"><\u002Fspan>Dough<\u002Fspan><\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 OUR STORY -->\n<section id=\"story\" aria-labelledby=\"story-title\" style=\"background: #702A35; color: #F2E6D4\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: 120px 40px; display: flex; flex-wrap: wrap; gap: 64px; align-items: center\">\n<div class=\"clip\" data-reveal=\"\" style=\"flex: 1 1 380px; min-width: 0; border: 1px solid rgba(242,230,212,.5); padding: 10px\">\n<div class=\"zoom\" data-cursor=\"Look\" style=\"height: 540px; overflow: hidden\">\n<div data-speed=\"0.12\" style=\"height: 100%\">\n<div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: the baker's hands shaping a loaf on a floured wooden bench\" style=\"height: 124%; margin-top: -12%; display: flex; align-items: flex-end; justify-content: center; padding: 80px 24px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331; text-align: center\">Photograph — hands shaping a loaf<br>on the floured between; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\"><span>At Home<\u002Fspan><span>Entry I<\u002Fspan><\u002Fdiv>\n<div class=\"zoom\" style=\"aspect-ratio: 4 / 3\"><div data-speed=\"0.05\" style=\"height: 100%\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: a baguette warming in an oven\" style=\"height: 112%; margin-top: -6%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h3 class=\"etitle\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.1\">How to revive a day-old baguette<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; font-weight: 300; color: #3E3A30\">A quick pass under the tap and a few minutes in a hot oven bring back a crackling crust.<\u002Fp>\n<span class=\"arrow\" aria-hidden=\"true\" style=\"font-size: 22px; color: #702A35\">→<\u002Fspan>\n<\u002Fa>\n<a class=\"entry rv\" data-reveal=\"\" data-cursor=\"Read\" href=\"#journal\" style=\"text-decoration: none; color: #292820; display: flex; flex-direction: column; gap: 18px; border-top: 1px solid #292820; padding-top: 20px; transition-delay: .12s\">\n<div style=\"display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #654331\"><span>The Craft<\u002Fspan><span>Entry II<\u002Fspan><\u002Fdiv>\n<div class=\"zoom\" style=\"aspect-ratio: 4 / 3\"><div data-speed=\"0.05\" style=\"height: 100%\"><div class=\"ph zin\" role=\"img\" aria-label=\"Photograph placeholder: the open crumb of a sliced country loaf\" style=\"height: 112%; margin-top: -6%\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h3 class=\"etitle\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 32px; line-height: 1.1\">Reading the crumb<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px; font-weight: 300; color: #3E3A30\">What the holes inside a loaf tell you about hydration, fermentation and the baker’s hand.<\u002Fp
